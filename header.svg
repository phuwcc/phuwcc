<svg width="1200" height="55" viewBox="0 0 1200 55"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8fd3f4"/>
      <stop offset="50%" stop-color="#c8b6e2"/>
      <stop offset="100%" stop-color="#f3a6c8"/>
    </linearGradient>

    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8fd3f4" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#c8b6e2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f3a6c8" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect width="1200" height="55" fill="url(#g2)"/>

  <!-- Main wave -->
  <path
    d="M-100 30
       C80 5, 180 5, 350 28
       S620 55, 800 28
       S1080 0, 1300 25
       L1300 55
       L-100 55 Z"
    fill="url(#g1)"
    opacity="0.8">

    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="-180 0"
      dur="8s"
      repeatCount="indefinite"/>
  </path>

  <!-- Secondary wave -->
  <path
    d="M-200 25
       C0 50, 160 50, 340 25
       S680 0, 900 25
       S1180 55, 1400 25
       L1400 55
       L-200 55 Z"
    fill="url(#g1)"
    opacity="0.35">

    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="180 0"
      dur="11s"
      repeatCount="indefinite"/>
  </path>

</svg>
